<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="breakout" class="hidden">
        <div class="plate">
            <div class="head">
                <div class="badge"><span class="ico i-cuffs"></span></div>
                <div class="titles">
                    <span id="title">Break Free</span>
                    <span id="subtitle">Restrained</span>
                </div>
                <span id="timer">0.0</span>
            </div>

            <div class="sbar-track"><div class="sbar-fill" id="progress"></div></div>

            <div class="prompt">
                <span class="glyph"><span class="ico i-mouse"></span><span id="key"></span></span>
                <span id="instruction">Shake your mouse</span>
                <span id="percent">0%</span>
            </div>

            <div class="time-line"><div id="time"></div></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
