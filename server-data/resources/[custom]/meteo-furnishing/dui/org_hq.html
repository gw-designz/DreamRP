<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="display" id="display">
        <!-- Top accent line -->
        <!-- <div class="top-line"></div> -->

        <!-- Header -->
        <div class="header">
            <div class="tag-wrapper">
                <div class="tag-glow"></div>
                <span class="tag" id="orgTag"></span>
            </div>
            <div class="org-name-wrapper">
                <span class="org-name" id="orgName"></span>
                <div class="org-name-underline"></div>
            </div>
        </div>

        <!-- Level center -->
        <div class="level-section">
            <div class="level-ring">
                <div class="level-ring-outer"></div>
                <div class="level-ring-inner"></div>
                <div class="level-content">
                    <span class="level-label">LEVEL</span>
                    <span class="level-number" id="orgLevel">1</span>
                </div>
                <div class="ring-accent ring-accent-tl"></div>
                <div class="ring-accent ring-accent-tr"></div>
                <div class="ring-accent ring-accent-bl"></div>
                <div class="ring-accent ring-accent-br"></div>
            </div>
        </div>

        <!-- Bottom accent -->
        <!-- <div class="bottom-line"></div> -->

        <!-- Corner decorations -->
        <!-- <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div> -->
    </div>

    <script src="js/main.js"></script>
</body>
</html>
