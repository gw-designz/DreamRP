<!doctype html>
<!-- Door prompt sprites, styled after my-hud's controls bar. Each [data-sprite] element is
     screenshotted by build.mjs into assets/hud/<name>.png. Edit labels here, then rebuild. -->
<html>
<head>
<meta charset="utf-8">
<style>
@font-face {
    font-family: 'Inter';
    src: url('Inter.ttf') format('truetype');
    font-weight: 100 900;
}

:root {
    --c-accent-rgb: 255, 36, 58;
    --c-accent-icon: #ff3348;
    --c-text: #f2f3f5;
    --c-grey: #8d929b;
    --c-glyph: #d9dce1;
    --c-glyph-text: #0a0a0c;
    --c-controls: rgba(8, 8, 10, .78);
    --shadow: 0 1px 3px rgba(0, 0, 0, .7);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: transparent; }

body {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 24px;
    padding: 24px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    color: var(--c-text);
    -webkit-font-smoothing: antialiased;
}

.chamfer { clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)); }

/* same plate as #control-bar */
.plate {
    --cut: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 16px 9px 10px;
    background: var(--c-controls);
    box-shadow: inset 0 -2px 0 rgba(var(--c-accent-rgb), .85);
    font-size: 15px;
    line-height: 1;
    white-space: nowrap;
    text-shadow: var(--shadow);
}

/* same key cap as .glyph */
.glyph {
    --cut: 4px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 22px;
    height: 22px;
    padding: 0 6px;
    background: var(--c-glyph);
    color: var(--c-glyph-text);
    font-size: 12px;
    font-weight: 700;
    line-height: 1;
    text-shadow: none;
}

.state { width: 16px; height: 16px; flex: none; color: var(--c-grey); }
.locked .state { color: var(--c-accent-icon); filter: drop-shadow(0 0 3px rgba(var(--c-accent-rgb), .6)); }

/* small plate shown when near a door but out of reach */
.ring {
    --cut: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    background: var(--c-controls);
    box-shadow: inset 0 -2px 0 rgba(var(--c-accent-rgb), .85);
}
.ring .state { width: 15px; height: 15px; }
</style>
</head>
<body>
