<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karma Developments NUI Boilerplate</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="app">
        <section id="progress" aria-hidden="true">
            <div class="progress-row">
                <span id="progress-label">GRABBING ITEM...</span>
                <span class="progress-cancel"><span class="key-chip light">ESC</span><span>CANCEL</span></span>
            </div>
            <div class="progress-track"><div id="progress-fill"></div></div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
