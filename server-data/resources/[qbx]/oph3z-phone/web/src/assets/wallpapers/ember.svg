<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="0.75" cy="0.55" r="0.95">
      <stop offset="0" stop-color="#3a2116"/>
      <stop offset="0.45" stop-color="#1c120e"/>
      <stop offset="1" stop-color="#080606"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb37a"/>
      <stop offset="0.5" stop-color="#ff6a2b"/>
      <stop offset="1" stop-color="#7a2a10"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a4a2c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1a0f0b" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="390" height="844" fill="url(#bg)"/>
  <ellipse cx="300" cy="300" rx="260" ry="330" fill="url(#fill)" filter="url(#soft)"/>
  <g fill="none" filter="url(#glow)">
    <ellipse cx="330" cy="290" rx="300" ry="340" stroke="url(#arc)" stroke-width="2.4" opacity="0.9" transform="rotate(-18 330 290)"/>
    <ellipse cx="360" cy="330" rx="250" ry="290" stroke="url(#arc)" stroke-width="1.6" opacity="0.65" transform="rotate(-12 360 330)"/>
    <ellipse cx="280" cy="720" rx="220" ry="160" stroke="url(#arc)" stroke-width="3.2" opacity="0.85" transform="rotate(-35 280 720)"/>
    <ellipse cx="300" cy="740" rx="180" ry="120" stroke="#ff7a3a" stroke-width="1.2" opacity="0.6" transform="rotate(-35 300 740)"/>
  </g>
  <rect width="390" height="844" fill="#000" opacity="0.18"/>
</svg>
